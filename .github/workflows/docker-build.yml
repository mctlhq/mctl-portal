name: Docker build

# Builds the production image on every PR so a broken Dockerfile fails review
# instead of the release build (mctl-portal#139: 4.17.0 never shipped because a
# new plugin was missing from the Dockerfile's workspace COPY list).
# The image is never pushed; publishing stays in mctl-gitops release-deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-copies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test the guard (green and red fixtures)
        run: scripts/check-dockerfile-workspaces.test.sh

      - name: Dockerfile copies every workspace manifest
        run: scripts/check-dockerfile-workspaces.sh

  build:
    # The structural check fails in seconds; skip the long build when it does.
    needs: workspace-copies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: mctl-portal:ci-${{ github.sha }}
          cache-from: type=gha,scope=mctl-portal-image
          cache-to: type=gha,scope=mctl-portal-image,mode=max
