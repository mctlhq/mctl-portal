name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mctlhq/mctl-portal

jobs:
  # ── Gate: TypeScript + lint checks must pass before build ───────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: TypeScript type-check
        run: yarn tsc --noEmit

      - name: Build backend (validates config + plugin wiring)
        run: yarn build:backend --config ../../app-config.yaml

  # ── Build Docker image + push to GHCR (only on main) ───────────────
  build-and-push:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # requires approval if protection rules are configured
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for semver calculation

      - name: Determine version bump
        id: version
        run: |
          git fetch --tags --force

          # Get latest tag (or default to 0.0.0 if none exists)
          LATEST_TAG=$(git tag -l --sort=-v:refname | head -n 1 || true)
          LATEST_TAG=${LATEST_TAG:-0.0.0}
          echo "Latest tag: $LATEST_TAG"

          # Parse version (strip v prefix if present for backwards compat)
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Determine bump type from commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          if echo "$COMMIT_MSG" | grep -qE '^[a-z]+!:|BREAKING CHANGE:'; then
            # Major bump for breaking changes
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            BUMP_TYPE="major"
          elif echo "$COMMIT_MSG" | grep -qE '^feat(\(.*\))?:'; then
            # Minor bump for features
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMP_TYPE="minor"
          elif echo "$COMMIT_MSG" | grep -qE '^fix(\(.*\))?:'; then
            # Patch bump for fixes
            PATCH=$((PATCH + 1))
            BUMP_TYPE="patch"
          else
            # Default to patch for other commits
            PATCH=$((PATCH + 1))
            BUMP_TYPE="patch"
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          while git rev-parse -q --verify "refs/tags/${NEW_VERSION}" >/dev/null; do
            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          done
          echo "New version: $NEW_VERSION (${BUMP_TYPE} bump)"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_number=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }} || echo "Tag already exists"
          git push origin ${{ steps.version.outputs.version }} || echo "Tag already pushed"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version_number }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version_number }}
          format: table
          exit-code: 0           # warn only — change to 1 to block on CVEs
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Update ArgoCD manifest
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Clone mctl-gitops repo
          git clone https://x-access-token:${GH_PAT}@github.com/${{ vars.GITOPS_REPO || 'mctlhq/mctl-gitops' }}.git /tmp/mctl-gitops
          cd /tmp/mctl-gitops

          # Update image tag in the mctl-portal bootstrap manifest
          sed -i "s/tag: .*/tag: ${{ steps.version.outputs.version_number }}/" platform-gitops/bootstrap/templates/mctl-platform/mctl-portal.yaml

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add platform-gitops/bootstrap/templates/mctl-platform/mctl-portal.yaml
          git commit -m "chore: update Backstage image to ${{ steps.version.outputs.version }}" || true
          git push || true

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram notification skipped: secrets are not configured"
            exit 0
          fi

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ mctl-portal build failed
Version: ${VERSION}
Commit: ${GITHUB_SHA}
Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -d disable_web_page_preview=true
