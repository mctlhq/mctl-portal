app:
  title: MCTL
  baseUrl: http://localhost:3000

enableExperimentalRedirectFlow: true

organization:
  name: MCTL

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
    # Residual (do not "fix" without a Backstage UI smoke test): Helmet keeps
    # style-src 'unsafe-inline' (MUI) and script-src 'unsafe-eval' (webpack).
    # script-src must not gain 'unsafe-inline'.
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: better-sqlite3
    connection: ':memory:'
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'local' # Alternatives - 'docker'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    guest: {}

argoWorkflows:
  baseUrl: http://localhost:2746   # argo workflows server (local: kubectl port-forward)
  namespace: argo-workflows
  # token: <bearer-token>

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    # Local example data, file locations are relative to the backend process, typically `packages/backend`
    - type: file
      target: ../../examples/entities.yaml

    # Local example template
    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    # Tenant User/Group/System entities come from TenantCatalogEntityProvider
    # (in-process). Do not fetch catalog.yaml over HTTP.

    # Auto-discover all services in platform-gitops (mctl-gitops)
    # NOTE: Discovery is handled by GithubEntityProvider (catalog.providers.github)
    # in production config. These URL locations are for local dev only.
    # - type: url
    #   target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/services/preview/*/*/catalog-info.yaml
    # - type: url
    #   target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/workers/preview/*/*/catalog-info.yaml

    # Platform self-service templates v2 (Argo Workflows) — uncomment for local dev:
    # - type: url
    #   target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/backstage-templates/deploy-component-v2/template.yaml
    #   rules:
    #     - allow: [Template]
    # - type: url
    #   target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/backstage-templates/deploy-version-v2/template.yaml
    #   rules:
    #     - allow: [Template]
    # - type: url
    #   target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/backstage-templates/update-component-config-v2/template.yaml
    #   rules:
    #     - allow: [Template]
    # - type: url
    #   target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/backstage-templates/delete-component-v2/template.yaml
    #   rules:
    #     - allow: [Template]
    # - type: url
    #   target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/backstage-templates/provision-database-v2/template.yaml
    #   rules:
    #     - allow: [Template]
    # - type: url
    #   target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/backstage-templates/create-tenant-v2/template.yaml
    #   rules:
    #     - allow: [Template]
    # Tenant Resource entities (local dev):
    # - type: url
    #   target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/tenants/*/catalog-info.yaml
    #   rules:
    #     - allow: [Resource]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

githubAppConnect:
  appSlug: mctl-app
  appId: ${GITHUB_APP_ID}
  privateKey: ${GITHUB_APP_PRIVATE_KEY}
  webhookSecret: ${GITHUB_WEBHOOK_SECRET}

vaultSecrets:
  endpoint: ${VAULT_ADDR}
  token: ${VAULT_TOKEN}

platform:
  domain: mctl.ai
  domainAlt: mctl.me
  githubOrg: mctlhq
  argocdBaseUrl: https://ops.mctl.me/applications/argocd
  argoWorkflowsBaseUrl: https://workflows.mctl.me
  gitopsRepo: mctl-gitops
  containerRegistry: ghcr.io/mctlhq

mctl:
  proposals:
    gitopsRepo: mctlhq/mctl-gitops
    branch: main
    basePath: platform-gitops/agents-state

tenantManagement:
  githubOrg: mctlhq
  repoName: mctl-gitops
  tenantsPath: platform-gitops/tenants
  syncIntervalMinutes: 5
  # githubToken: ${GITHUB_TOKEN}  # falls back to integrations.github[0].token if unset
  # landingPageToken: ${BACKSTAGE_LANDING_TOKEN}  # static bearer token for Cloudflare Worker
  defaultQuotas:
    cpuReq: '1'
    cpuLim: '2'
    memReq: '2Gi'
    memLim: '3Gi'
    pods: '10'
    pvcs: '2'
    services: '5'

resourceUsage:
  # 'default' = use ~/.kube/config for local development
  # 'inCluster' = use pod SA token (production)
  # 'token' = explicit kubeApiUrl + kubeToken
  kubeConfigType: default

oidcProvider:
  issuer: http://localhost:7007/api/oidc-provider
  clients:
    - clientId: test-client
      clientSecret: test-secret
      redirectUris:
        - http://localhost:5556/dex/callback
