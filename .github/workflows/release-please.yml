name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # release-please has to open the release PR as somebody. The default
      # GITHUB_TOKEN cannot: "Allow GitHub Actions to create and approve pull
      # requests" is off at the org level, and on mctl-telegram every push to
      # main after 0.59.0 failed with "GitHub Actions is not permitted to
      # create or approve pull requests" until mctl-telegram#498 -- seven
      # releases' worth of commits with no release PR and nothing deployed.
      # Nothing has broken here yet only because there have been no
      # user-facing commits since the last release; the first one would hit
      # the same wall. Minting a token from the mctl-agents App (contents +
      # pull-requests write on every mctlhq repo) sidesteps the setting
      # without turning it back on, and a PR opened with an App token also
      # raises pull_request events, so the release PR gets normal CI instead
      # of the default token's silent one.
      # This bot mint still uses AGENTS_APP_PRIVATE_KEY until Stage 5 of
      # mctl-gitops#1033 moves it to mctl-repo-bot.
      - name: Generate release token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-portal
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Dispatch lives in its own job so it can carry a main-only environment and
  # so the dispatch key is never in the same job as release-please. The
  # environment `app-dispatch` is restricted to the default branch: on any
  # other ref it yields no secret and the mint step fails closed. There is
  # deliberately no fallback to AGENTS_APP_PRIVATE_KEY (mctl-gitops#1033).
  dispatch:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: app-dispatch
    permissions: {}
    steps:
      # mctl-gitops-dispatch is the dispatch-only App: actions:write on
      # mctl-gitops, nothing else. Deliberately NOT MCTL App (APP_CLIENT_ID,
      # installed by customers) and no longer the broad mctl-agents App.
      - name: Generate dispatch token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops
          permission-actions: write

      - name: Dispatch centralized release-deploy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh workflow run release-deploy.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f repo=mctlhq/mctl-portal \
            -f git_ref="$TAG" \
            -f image_name=ghcr.io/mctlhq/mctl-portal \
            -f image_tag="$TAG" \
            -f team_name=admins \
            -f component_name=mctl-portal \
            -f values_path=platform-gitops/bootstrap/templates/mctl-platform/mctl-portal.yaml

  # Separate job so the Telegram secrets are not in the environment-bound
  # dispatch job. It reports a failed dispatch or a failed release step after a
  # release was created (the same condition the old in-job step had); a failure
  # before any release exists is not a deploy failure and is not reported here.
  notify:
    needs: [release-please, dispatch]
    if: ${{ failure() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify Telegram on release/deploy failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram notification skipped: secrets are not configured"
            exit 0
          fi

          MESSAGE=$(cat <<EOF
          ❌ mctl-portal release-deploy dispatch failed
          Tag ${TAG} was created but the centralized deploy did not dispatch.
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d disable_web_page_preview=true
