name: security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "47 4 * * 1"

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "0"
          ignore-unfixed: true
          version: v0.69.3
          # Report-only: yarn.lock already has a large CRITICAL backlog
          # (vm2 via Backstage). Dependabot PRs are the remediation path;
          # this workflow exists so the scan runs on every PR (SOC F16).
